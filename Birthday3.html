
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Ankita ♡</title>

<style>
	.cake img {
    width: 250px;
    max-width: 80%;
    height: auto;
    border-radius: 20px;
    filter: drop-shadow(0 8px 12px #d98ba8);
    animation: bounce 2s infinite;
}
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ffe0eb, #fff0f5, #ffd6e5);
    color: #a83d61;
    overflow: hidden;
}

.container {
    padding: 30px 15px;
}

h1 {
    font-size: clamp(38px, 9vw, 85px);
    margin: 10px 0;
    letter-spacing: 3px;
    text-shadow: 3px 3px 8px #ffffff;
}

.cake {
    font-size: clamp(100px, 20vw, 180px);
    margin: 25px 0;
    animation: bounce 2s infinite;
}

.message {
    font-size: 23px;
    font-style: italic;
    margin: 20px;
}

.name {
    font-size: 34px;
    font-weight: bold;
}

.hearts {
    font-size: 30px;
    margin: 20px;
}

button {
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    background: #d95d85;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #b83e69;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}
</style>
</head>

<body>

<div class="container">

    <div class="hearts">♡ ✨ ♡ ✨ ♡</div>

    <h2>ONCE AGAIN <br> HAPPY<br>BIRTHDAY!<br> TO YOU BESTIEE</h2>

    <div class="cake">
    <img src="Photo4.jpg" alt="Birthday Cake">
</div>

    <div class="name">Dear Ankita ♡</div>

    <p class="message">
        May your life always be filled with<br>
        happiness, laughter, love and beautiful memories.
    </p>

    <h2>Keep shining and stay amazing! 💗</h2>

    <div class="hearts">🎀 💕 🎀</div>

</div>

</body>
</html>
